version: '3.8'
services:

# multi manager cluster with minio s3 storage

# Before starting, create external secrets:
# echo "my-secret-key" | docker secret create secret_key -
# echo "minioadmin"    | docker secret create minio_root_user -
# echo "minioadmin"    | docker secret create minio_root_password -

# start:
# docker stack deploy --compose-file  Docker/LocalCluster.s3.yaml cron_stack_s3

# debug:
# docker stack ps cron_stack_s3
# docker service logs cron_stack_s3_manager1

# remove
# docker stack rm cron_stack_s3

  minio:
    image: minio/minio
    hostname: minio
    volumes:
      - cron_drive_s3:/data
    networks:
      - cron
    deploy:
      replicas: 1
    entrypoint: /bin/bash
    command: -c 'mkdir -p /data/cronicle && exec minio server /data --console-address ":9001"'
    environment:
      - MINIO_ROOT_USER_FILE=/run/secrets/minio_root_user
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_root_password
    secrets:
      - source: minio_root_user
        uid: "0"
        gid: "0"
        mode: 0400
      - source: minio_root_password
        uid: "0"
        gid: "0"
        mode: 0400

  manager1:
    image: cronicle/edge:latest
    hostname: manager1
    ports:
      - "3012:3012"
    networks:
      - cron
    deploy:
      replicas: 1
    command: >-
      /bin/bash -c '
      export CRONICLE_Storage__AWS__credentials__accessKeyId=$(cat /run/secrets/minio_root_user) &&
      export CRONICLE_Storage__AWS__credentials__secretAccessKey=$(cat /run/secrets/minio_root_password) &&
      exec manager'
    environment:
      - CRONICLE_secret_key_file=/run/secrets/secret_key
      - CRONICLE_cluster=worker1,worker2
    secrets:
      - source: secret_key
        uid: "0"
        gid: "0"
        mode: 0400
      - source: minio_root_user
        uid: "0"
        gid: "0"
        mode: 0400
      - source: minio_root_password
        uid: "0"
        gid: "0"
        mode: 0400
    configs:
     - source: cron_s3
       target: /opt/cronicle/conf/storage.json

  worker1:
    image: cronicle/edge:latest
    hostname: worker1
    networks:
      - cron
    deploy:
      replicas: 1
    command: >-
      /bin/bash -c '
      export CRONICLE_Storage__AWS__credentials__accessKeyId=$(cat /run/secrets/minio_root_user) &&
      export CRONICLE_Storage__AWS__credentials__secretAccessKey=$(cat /run/secrets/minio_root_password) &&
      exec worker'
    environment:
      - CRONICLE_secret_key_file=/run/secrets/secret_key
    secrets:
      - source: secret_key
        uid: "0"
        gid: "0"
        mode: 0400
      - source: minio_root_user
        uid: "0"
        gid: "0"
        mode: 0400
      - source: minio_root_password
        uid: "0"
        gid: "0"
        mode: 0400
    configs:
     - source: cron_s3
       target: /opt/cronicle/conf/storage.json

  worker2:
    image: cronicle/edge:latest
    hostname: worker2
    networks:
      - cron
    deploy:
      replicas: 1
    command: >-
      /bin/bash -c '
      export CRONICLE_Storage__AWS__credentials__accessKeyId=$(cat /run/secrets/minio_root_user) &&
      export CRONICLE_Storage__AWS__credentials__secretAccessKey=$(cat /run/secrets/minio_root_password) &&
      exec worker'
    environment:
      - CRONICLE_secret_key_file=/run/secrets/secret_key
    secrets:
      - source: secret_key
        uid: "0"
        gid: "0"
        mode: 0400
      - source: minio_root_user
        uid: "0"
        gid: "0"
        mode: 0400
      - source: minio_root_password
        uid: "0"
        gid: "0"
        mode: 0400
    configs:
     - source: cron_s3
       target: /opt/cronicle/conf/storage.json


networks:
  cron:
    driver: overlay
    attachable: true

configs:
  cron_s3:
    file: ./storage.s3.json

secrets:
  secret_key:
    external: true
  minio_root_user:
    external: true
  minio_root_password:
    external: true

volumes:
  cron_drive_s3:
